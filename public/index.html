<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cloth Simulation - Verlet</title>
    <style>
      html,
      body {
        overscroll-behavior: contain;
      }

      body {
        margin: 0;
        background: #111;
        color: #fff;
        font-family: sans-serif;
      }

      canvas {
        display: block;
      }

      #debug {
        zoom: 1.5;
        position: absolute;
        top: 2rem;
        right: 2rem;
        z-index: 1;
      }

      #reload {
        font-size: 3em;
        line-height: 0;
        position: absolute;
        top: 3rem;
        right: 1rem;
        z-index: 1;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <pre id="debug"></pre>
    <div id="reload" onclick="location.reload()">↻</div>
    <script type="module" src="main.js"></script>
  </body>
</html>
